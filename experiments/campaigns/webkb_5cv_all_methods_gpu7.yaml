# WebKB 5-fold — all paper methods + curriculum ablations on GPU 7.
#
# Includes:
#   - 2² factorial: raw / is / cl / is_cl (biois_discrete)
#   - Curriculum signal ablation: loss / lrc / td
#   - CL parameter ablation: schedule / signal weights / flat compute
#   - Literature baselines: Bengio (b1), SPDCL (b2), self-adaptive PMD
#
# Smoke:   uv run bio-experiment experiments/campaigns/webkb_5cv_all_methods_gpu7.yaml --folds 0
# Dry-run: uv run bio-experiment experiments/campaigns/webkb_5cv_all_methods_gpu7.yaml --dry-run
# Full:
#   mkdir -p logs
#   nohup uv run bio-experiment experiments/campaigns/webkb_5cv_all_methods_gpu7.yaml \
#     > logs/webkb_5cv_all_methods_gpu7.log 2>&1 &

docker:
  image: bio-is-curriculum:latest
  gpu_id: 7
  cpus: 16
  memory: 32g

campaign:
  name: webkb_5cv_all_methods_gpu7
  timestamp: auto
  summary:
    layout: compare_by_dataset
    metrics:
      - macro_f1
      - micro_f1
      - hard_slice_macro_f1
      - n_train_instances
      - n_removed
      - is_reduction
      - train_time_s
      - sa_score_time_s
      - nuclear_norm_time_s
      - total_time
  datasets:
    webkb: { n_splits: 5 }

  defaults:
    model: modernbert
    hf_model: answerdotai/ModernBERT-base
    folds: [0, 1, 2, 3, 4]
    instance_selection:
      beta: 0.3
      theta: 0.2
    baseline:
      b1_easy_fraction: 0.5
      b1_use_global_quantile: true
      spdcl_n_bins: 5
      spdcl_curriculum_epochs: 5
      spdcl_anneal_epochs: 1
    curriculum:
      method: biois_discrete
      q_low: 0.3
      q_mid: 0.6
      q_high: 0.95
      beta: 0.5
      margin_weight: 0.6
      entropy_weight: 0.4
      length_weight: 0.25
      noise_weight_phases: [hard]
      phase_max_lengths: [96, 160, 256]
      prompt_suffix: " This text is [MASK]."
      hard_fraction: 0.6
      rank_exponent: 2.0
      score_batch_size: 64
    training:
      epochs: 6
      epochs_per_phase: 2
      batch_size: 32
      eval_batch_size: 64
      max_length: 256
      lr: 2.0e-5
      weight_decay: 0.001
      warmup_ratio: 0.06
      imbalance_method: inverse_freq_ce

  jobs:
    # 2² factorial (BIOIS curriculum)
    - modes: [raw, is, cl, is_cl]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}"

    # Curriculum signal ablations (same schedule; signal changes)
    - modes: [cl]
      matrix:
        curriculum.method: [loss_discrete, lrc_discrete, td_discrete]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_{method}"

    # CL parameter ablation (one focal change per job)
    - modes: [cl]
      matrix:
        curriculum.q_low: [0.2]
        curriculum.q_mid: [0.5]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_sched_q02-05"

    - modes: [cl]
      matrix:
        curriculum.margin_weight: [0.3]
        curriculum.entropy_weight: [0.7]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_sig_entropy"

    - modes: [cl]
      matrix:
        curriculum.phase_max_lengths: [[256, 256, 256]]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_compute_flat"

    # Bengio (2 phases × 3 epochs)
    - modes: [b1, is_b1]
      matrix:
        training.epochs_per_phase: [3]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_b1"

    # SPDCL
    - modes: [b2, is_b2]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_spdcl"

    # Self-adaptive PMD
    - modes: [cl, is_cl]
      matrix:
        curriculum.method: [self_adaptive_pmd]
        training.epochs_per_phase: [6]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_self_adaptive_pmd"
