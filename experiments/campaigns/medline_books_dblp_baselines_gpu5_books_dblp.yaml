# Books + DBLP baselines on GPU 5 (moved off GPU 6 for parallelism).
#
# GPU 6 is finishing medline self-adaptive (cl done; is_cl in progress).
# Books/dblp never started — run them here under the same timestamp.
#
# After medline SA completes on GPU 6, stop that process so it does not
# re-run books/dblp (the live job still has those batches queued):
#   pkill -f 'medline_books_dblp_baselines_gpu6.yaml'
#
# Launch:
#   nohup uv run bio-experiment experiments/campaigns/medline_books_dblp_baselines_gpu5_books_dblp.yaml \
#     > logs/medline_books_dblp_baselines_gpu5_books_dblp.log 2>&1 &

docker:
  image: bio-is-curriculum:latest
  gpu_id: 5
  cpus: 16
  memory: 32g

campaign:
  name: medline_books_dblp_baselines_gpu5_books_dblp
  timestamp: "20260920-173032"
  summary:
    layout: compare_by_dataset
    metrics:
      - macro_f1
      - micro_f1
      - hard_slice_macro_f1
      - n_train_instances
      - n_removed
      - train_time_s
      - sa_score_time_s
      - nuclear_norm_time_s
      - total_time
  datasets:
    books: { n_splits: 5 }
    dblp: { n_splits: 5 }

  defaults:
    model: modernbert
    hf_model: answerdotai/ModernBERT-base
    folds: [0, 1, 2, 3, 4]
    instance_selection:
      beta: 0.3
      theta: 0.2
    baseline:
      b1_easy_fraction: 0.5
      b1_use_global_quantile: true
      spdcl_n_bins: 5
      spdcl_curriculum_epochs: 5
      spdcl_anneal_epochs: 1
      spdcl_norm_subsample: 15000
    curriculum:
      prompt_suffix: " This text is [MASK]."
      hard_fraction: 0.6
      rank_exponent: 2.0
      score_batch_size: 64
    training:
      epochs: 6
      epochs_per_phase: 3
      batch_size: 32
      eval_batch_size: 64
      max_length: 256
      lr: 2.0e-5
      weight_decay: 0.001
      warmup_ratio: 0.06
      imbalance_method: inverse_freq_ce

  jobs:
    - modes: [b1, is_b1]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_b1"

    - modes: [b2, is_b2]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_spdcl"

    - modes: [cl, is_cl]
      matrix:
        curriculum.method: [self_adaptive_pmd]
        training.epochs_per_phase: [6]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_self_adaptive_pmd"
