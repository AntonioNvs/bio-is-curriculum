# 2² factorial — IS arm only (raw vs is) on 4 datasets, 20% train subsample.
# Datasets: reuters90, webkb, agnews, yelp_2013
#
# Smoke:  uv run bio-experiment experiments/campaigns/factorial_raw_is_20pct.yaml --dataset webkb --folds 0
# Dry-run: uv run bio-experiment experiments/campaigns/factorial_raw_is_20pct.yaml --dry-run

docker:
  image: bio-is-curriculum:latest
  gpu_id: 5
  cpus: 16
  memory: 32g

campaign:
  name: factorial_raw_is_20pct
  timestamp: auto
  summary:
    layout: compare_by_dataset
    metrics:
      - macro_f1
      - micro_f1
      - f1_weighted
      - accuracy
      - hard_slice_macro_f1
      - n_train_instances
      - n_removed
      - train_time_s
      - total_time

  datasets:
    reuters90: { n_splits: 5 }
    webkb: { n_splits: 10 }
    agnews: { n_splits: 5 }
    yelp_2013: { n_splits: 5 }

  defaults:
    model: modernbert
    hf_model: answerdotai/ModernBERT-base
    instance_selection:
      beta: 0.3
      theta: 0.2
    training:
      train_fraction: 1
      epochs: 6
      epochs_per_phase: 2
      batch_size: 16
      eval_batch_size: 32
      max_length: 256
      lr: 2.0e-5
      weight_decay: 1.0e-3
      warmup_ratio: 0.06
      imbalance_method: inverse_freq_ce

  jobs:
    - modes: [raw, is]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}"
