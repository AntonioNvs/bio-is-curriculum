# CL parameter ablation — margin/compute-aware biois_discrete scheduler.
#
# Three ablation axes (one focal change per job; all other params at defaults):
#   1. Schedule  — tight phase quantiles (q=0.2/0.5)
#   2. Signal    — entropy-dominant weights (0.3/0.7 margin/entropy)
#   3. Compute   — flat token caps (256/256/256, no progressive lengths)
#
# Reference baseline (not re-run here): curriculum_ablations_multi biois_discrete
# defaults (q=0.3/0.6, margin 0.6/0.4, phase_max_lengths 96/160/256).
#
# Rebuild image after scheduler changes:
#   docker build -t bio-is-curriculum:latest .
#
# Smoke:   uv run bio-experiment experiments/campaigns/cl_params_ablation_multi.yaml --dataset webkb --folds 0
# Dry-run: uv run bio-experiment experiments/campaigns/cl_params_ablation_multi.yaml --dry-run

docker:
  image: bio-is-curriculum:latest
  gpu_id: 5
  cpus: 16
  memory: 32g

campaign:
  name: cl_params_ablation_multi
  timestamp: auto
  summary:
    layout: compare_by_dataset
    metrics:
      - macro_f1
      - micro_f1
      - hard_slice_macro_f1
      - train_time_s
      - total_time
  datasets:
    webkb: { n_splits: 10 }
    reuters90: { n_splits: 5 }
    yelp_2013: { n_splits: 5 }
    agnews: { n_splits: 5 }

  defaults:
    model: modernbert
    instance_selection:
      beta: 0.3
      theta: 0.2
    curriculum:
      method: biois_discrete
      q_low: 0.3
      q_mid: 0.6
      q_high: 0.95
      beta: 0.5
      margin_weight: 0.6
      entropy_weight: 0.4
      length_weight: 0.25
      noise_weight_phases: [hard]
      phase_max_lengths: [96, 160, 256]
    training:
      epochs: 6
      epochs_per_phase: 2
      batch_size: 32
      max_length: 256
      lr: 2.0e-5
      imbalance_method: inverse_freq_ce

  jobs:
    - modes: [cl]
      matrix:
        curriculum.q_low: [0.2]
        curriculum.q_mid: [0.5]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_sched_q02-05"

    - modes: [cl]
      matrix:
        curriculum.margin_weight: [0.3]
        curriculum.entropy_weight: [0.7]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_sig_entropy"

    - modes: [cl]
      matrix:
        curriculum.phase_max_lengths: [[256, 256, 256]]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_compute_flat"
