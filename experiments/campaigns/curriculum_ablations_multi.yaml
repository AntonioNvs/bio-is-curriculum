docker:
  image: bio-is-curriculum:latest
  gpu_id: 7
  cpus: 16
  memory: 32g

campaign:
  timestamp: auto
  datasets:
    webkb: { n_splits: 10 }
    reuters90: { n_splits: 5 }
    yelp_2013: { n_splits: 5 }
    medline: { n_splits: 5 }

  defaults:
    model: roberta
    instance_selection:
      beta: 0.3
      theta: 0.2
    curriculum:
      q_low: 0.3
      q_mid: 0.6
      q_high: 0.95
      beta: 0.5
    training:
      epochs: 6
      epochs_per_phase: 2
      batch_size: 32
      max_length: 256
      lr: 2.0e-5
      imbalance_method: inverse_freq_ce

  jobs:
    - modes: [cl]
      matrix:
        curriculum.method:
          - biois_discrete
          - length_discrete
          - loss_discrete
          - tfidf_discrete
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_{method}"