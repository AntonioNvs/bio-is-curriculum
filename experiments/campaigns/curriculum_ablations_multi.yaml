# Curriculum signal ablation with the margin/compute-aware discrete scheduler.
#
# biois_discrete already completed in:
#   results/experiments/curriculum_ablations_multi_20260914-172338
# This campaign reruns only the alternative difficulty signals (Loss, LRC, TD)
# under the same schedule: q=0.3/0.6/0.95, phase_max_lengths=96/160/256.
#
# Full campaign (all datasets, all folds):
#   uv run bio-experiment experiments/campaigns/curriculum_ablations_multi.yaml
#
# Smoke (fold 0, single dataset):
#   uv run bio-experiment experiments/campaigns/curriculum_ablations_multi.yaml --dataset webkb --folds 0

docker:
  image: bio-is-curriculum:latest
  gpu_id: 6
  cpus: 16
  memory: 32g

campaign:
  name: curriculum_ablations_multi
  timestamp: auto
  summary:
    layout: compare_by_dataset
    metrics:
      - macro_f1
      - micro_f1
      - hard_slice_macro_f1
      - train_time_s
      - total_time
  datasets:
    webkb: { n_splits: 10 }
    reuters90: { n_splits: 5 }
    yelp_2013: { n_splits: 5 }
    agnews: { n_splits: 5 }

  defaults:
    model: modernbert
    instance_selection:
      beta: 0.3
      theta: 0.2
    curriculum:
      q_low: 0.3
      q_mid: 0.6
      q_high: 0.95
      beta: 0.5
      # Shared discrete scheduler (all methods below).
      phase_max_lengths: [96, 160, 256]
      # BIOIS-only signal weights (ignored by loss/lrc/td).
      margin_weight: 0.6
      entropy_weight: 0.4
      length_weight: 0.25
      noise_weight_phases: [hard]
    training:
      epochs: 6
      epochs_per_phase: 2
      batch_size: 32
      max_length: 256
      lr: 2.0e-5
      imbalance_method: inverse_freq_ce

  jobs:
    - modes: [cl]
      matrix:
        curriculum.method:
          - loss_discrete
          - lrc_discrete
          - td_discrete
          # - biois_discrete  # completed: curriculum_ablations_multi_20260914-172338
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_{method}"
