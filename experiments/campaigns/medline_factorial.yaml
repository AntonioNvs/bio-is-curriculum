# Medline 5-fold: IS / CL / IS+CL (no raw).
#
# Curriculum profile matches is_cl_best_multi / curriculum_ablations defaults
# (biois_discrete, q=0.3/0.6/0.95, progressive phase lengths).
#
# Smoke:  uv run bio-experiment experiments/campaigns/medline_factorial.yaml --folds 0
# Dry-run: uv run bio-experiment experiments/campaigns/medline_factorial.yaml --dry-run
# Full:   nohup uv run bio-experiment experiments/campaigns/medline_factorial.yaml \
#           > logs/medline_factorial.log 2>&1 &

docker:
  image: bio-is-curriculum:latest
  gpu_id: 7
  cpus: 16
  memory: 32g

campaign:
  name: medline_factorial
  timestamp: auto
  summary:
    layout: compare_by_dataset
    metrics:
      - macro_f1
      - micro_f1
      - hard_slice_macro_f1
      - n_train_instances
      - n_removed
      - is_reduction
      - train_time_s
      - total_time
  datasets:
    medline: { n_splits: 5 }

  defaults:
    model: modernbert
    hf_model: answerdotai/ModernBERT-base
    folds: [0, 1, 2, 3, 4]
    instance_selection:
      beta: 0.3
      theta: 0.2
    curriculum:
      method: biois_discrete
      q_low: 0.3
      q_mid: 0.6
      q_high: 0.95
      beta: 0.5
      margin_weight: 0.6
      entropy_weight: 0.4
      length_weight: 0.25
      noise_weight_phases: [hard]
      phase_max_lengths: [96, 160, 256]
    training:
      epochs: 6
      epochs_per_phase: 2
      batch_size: 32
      eval_batch_size: 64
      max_length: 256
      lr: 2.0e-5
      weight_decay: 0.001
      warmup_ratio: 0.06
      imbalance_method: inverse_freq_ce

  jobs:
    - modes: [is, cl, is_cl]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}"
