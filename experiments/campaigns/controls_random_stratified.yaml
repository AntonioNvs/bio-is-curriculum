# Random stratified subsample at matched retention — is selection even needed?
#
# WHY THIS EXISTS
# IS removes redundant-correct and low-entropy-misclassified instances, then CL
# schedules what remains. The cheapest possible alternative is to throw away the
# same FRACTION of training data at random — no posteriors, no redundancy score,
# no phases. If that matches SPURS, the whole method is a expensive way to
# subsample.
#
# This is a *fraction* control, not a *count* control: it matches the retention
# rate, so the remaining arms see the same number of training instances. That is
# what makes it the right null for "the gain is just less data".
#
# train_fraction uses StratifiedShuffleSplit over the train split
# (data/preprocessing.py), so the subsample keeps the class distribution of the
# full training set. That is deliberately more generous to the control than a
# uniform subsample would be — if plain stratified subsampling matched BIOIS,
# the method would be dead, and the control should be able to show that.
#
# RETENTION: MEASURED, NOT GUESSED
# The value is 1 - is_reduction from Y1's factorial_matched_2x2 summary, averaged
# over the 5 folds of each dataset. The retention differs per dataset — it spans
# 0.637 to 0.683, a spread of ~4.6 points — so this is ONE JOB PER DATASET, each
# with its own value. A single shared constant would give two of the three
# controls the wrong denominator.
#
#   dataset     is_reduction (mean of 5 folds)   1 - is_reduction
#   reuters90   0.363029                          0.6370   (prunes most)
#   books       0.340370                          0.6596
#   agnews      0.316891                          0.6831   (prunes least)
#
# Source: results/<dataset>-5cv-<ts>_factorial_matched/summary.csv, metric
# is_reduction, mode is. Mode is_cl reports the same figure — it is the selection
# stage's reduction, which CL inherits — so either mode gives the value.
#
# WHAT THIS MATCHES, AND WHAT IT DOES NOT. This matches the RETENTION RATE, not
# the absolute instance count. The control ends up with ~5% more training data
# than is_cl trains on (6092 vs 5813 on reuters90 fold 0). Two causes: reuters90's
# selection stage runs on a train split that maybe_upsample_for_biois has already
# inflated (reduction is a fraction of ~9632, not of the raw 9567), and is_cl's
# n_train_instances counts a phase subset rather than the full selected set. Both
# lean the same way, and it is the safe way: the control gets MORE data than
# SPURS, so a SPURS win cannot be an artefact of starving the baseline. If an
# exact count match is wanted instead, use n_is_cl/n_raw — reuters90 0.6072,
# books 0.6265, agnews 0.6489.
#
# scripts/run_campaign.py refuses to execute while its placeholder marker (see
# PLACEHOLDER_MARKER there) appears in this file, so a mistyped launch cannot burn
# GPU-hours on a mis-specified control. The marker is gone; this line must not
# reintroduce it by naming it.
#
# DATASETS: the same three as Y3, so the control lines up against the score arms.
#
# COST: 3 datasets x 5 folds = 15 runs ≈ 5.1 GPU-h.
#
# RunPod: pods have no Docker daemon, so ALWAYS pass --no-docker, and run from
# the repo root (results_dir/data_dir are relative). scripts/run_campaign.py does
# both. gpu_id is recorded in the manifest for provenance only.
#
# Smoke:   uv run bio-experiment experiments/campaigns/controls_random_stratified.yaml \
#            --no-docker --dataset reuters90 --folds 0
# Dry-run: uv run bio-experiment experiments/campaigns/controls_random_stratified.yaml \
#            --no-docker --dry-run
#
# Template var from the matrix: {train_fraction} — the short name is the last
# dotted component (only curriculum.method/loss_scheme have short aliases in
# config/campaign.py::_MATRIX_KEY_ALIASES), so "{frac}" would raise KeyError.

docker:
  image: bio-is-curriculum:latest
  gpu_id: 0
  cpus: 16
  memory: 32g

campaign:
  name: controls_random_stratified
  timestamp: auto
  summary:
    layout: compare_by_dataset
    metrics:
      - macro_f1
      - hard_slice_macro_f1
      - n_train_instances
      - train_time_s
      - total_time

  datasets:
    books:     { n_splits: 5 }
    reuters90: { n_splits: 5 }
    agnews:    { n_splits: 5 }

  defaults:
    model: modernbert
    hf_model: answerdotai/ModernBERT-base
    folds: [0, 1, 2, 3, 4]
    random_state: 42
    training:
      batch_size: 32
      eval_batch_size: 64
      max_length: 256
      epochs: 6
      epochs_per_phase: 2
      lr: 2.0e-5
      weight_decay: 0.001
      warmup_ratio: 0.06
      imbalance_method: inverse_freq_ce

  jobs:
    # One job per dataset, because the retention is a per-dataset measurement.
    # `datasets` scopes a job to that dataset alone (schema.py:230); putting the
    # three values in one matrix would instead cross every dataset with every
    # value and triple the cost.
    - datasets: [reuters90]
      modes: [raw]
      matrix:
        training.train_fraction: [0.6370]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_raw_rand{train_fraction}"

    - datasets: [books]
      modes: [raw]
      matrix:
        training.train_fraction: [0.6596]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_raw_rand{train_fraction}"

    - datasets: [agnews]
      modes: [raw]
      matrix:
        training.train_fraction: [0.6831]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_raw_rand{train_fraction}"
