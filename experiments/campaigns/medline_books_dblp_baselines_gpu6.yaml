# Medline self-adaptive PMD on GPU 6 (books/dblp moved to GPU 5).
#
# Remaining: medline is_cl folds still in progress on the live job.
# Books + DBLP now run on:
#   experiments/campaigns/medline_books_dblp_baselines_gpu5_books_dblp.yaml
#
# When medline SA finishes (summary printed), kill this job so it does not
# continue into books/dblp from the original in-memory batch list:
#   pkill -f 'medline_books_dblp_baselines_gpu6.yaml'
#
# Resume only medline SA (e.g. after a crash); skip completed cl / is_cl folds
# by removing only incomplete fold dirs first:
#   nohup uv run bio-experiment experiments/campaigns/medline_books_dblp_baselines_gpu6.yaml \
#     > logs/medline_books_dblp_baselines_gpu6.log 2>&1 &
#
# NOTE: the runner does not skip existing folds — only launch a resume after
# trimming unfinished fold dirs, or use --folds for the missing ones.

docker:
  image: bio-is-curriculum:latest
  gpu_id: 6
  cpus: 16
  memory: 32g

campaign:
  name: medline_books_dblp_baselines_gpu6
  timestamp: "20260920-173032"
  summary:
    layout: compare_by_dataset
    metrics:
      - macro_f1
      - micro_f1
      - hard_slice_macro_f1
      - n_train_instances
      - n_removed
      - train_time_s
      - sa_score_time_s
      - nuclear_norm_time_s
      - total_time
  datasets:
    medline: { n_splits: 5 }

  defaults:
    model: modernbert
    hf_model: answerdotai/ModernBERT-base
    folds: [0, 1, 2, 3, 4]
    instance_selection:
      beta: 0.3
      theta: 0.2
    baseline:
      b1_easy_fraction: 0.5
      b1_use_global_quantile: true
      spdcl_n_bins: 5
      spdcl_curriculum_epochs: 5
      spdcl_anneal_epochs: 1
      spdcl_norm_subsample: 15000
    curriculum:
      prompt_suffix: " This text is [MASK]."
      hard_fraction: 0.6
      rank_exponent: 2.0
      score_batch_size: 64
    training:
      epochs: 6
      epochs_per_phase: 3
      batch_size: 32
      eval_batch_size: 64
      max_length: 256
      lr: 2.0e-5
      weight_decay: 0.001
      warmup_ratio: 0.06
      imbalance_method: inverse_freq_ce

  jobs:
    - modes: [cl, is_cl]
      matrix:
        curriculum.method: [self_adaptive_pmd]
        training.epochs_per_phase: [6]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_self_adaptive_pmd"
