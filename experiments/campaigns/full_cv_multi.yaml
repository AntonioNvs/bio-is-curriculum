# Multi-dataset full CV with curriculum matrix (replaces run_docker_full_cv_multi.sh)
docker:
  image: bio-is-curriculum:latest
  gpu_id: 7
  cpus: 16
  memory: 32g

campaign:
  name: full_cv_multi
  timestamp: auto
  summary:
    layout: compare_by_dataset
    metrics:
      - macro_f1
      - micro_f1
      - f1_weighted
      - accuracy
      - hard_slice_macro_f1
      - train_time_s
      - total_time
  datasets:
    webkb: { n_splits: 10 }
    reuters90: { n_splits: 5 }
    mpqa: {}
    20ng: {}
    yelp_reviews: {}
    twitter: {}
    sst1: {}

  defaults:
    n_splits: 10
    model: modernbert
    instance_selection:
      beta: 0.3
      theta: 0.2
    curriculum:
      q_low: 0.3
      q_mid: 0.6
      q_high: 0.95
    training:
      epochs: 6
      epochs_per_phase: 2
      batch_size: 32
      lr: 2.0e-5
      imbalance_method: inverse_freq_ce

  jobs:
    - modes: [raw, is, b1]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}"

    - modes: [cl, is_cl]
      matrix:
        curriculum.method: [biois_discrete, spcl_soft, length_discrete, loss_discrete, tfidf_discrete]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_{method}"

    - modes: [cl, is_cl]
      matrix:
        curriculum.method: [spcl_loss]
        curriculum.loss_scheme: [linear, binary, log, mixture]
      experiment_id: "{dataset}-{n_splits}cv-{timestamp}_{method}_{loss_scheme}"
