# Fast SPDCL smoke test (webkb, paper-near hyperparameters)
dataset: webkb
n_splits: 10
model: roberta

modes:
  - raw
  - b2

folds: [0]

baseline:
  spdcl_n_bins: 2
  spdcl_curriculum_epochs: 2
  spdcl_anneal_epochs: 1

training:
  hf_model: roberta-base
  batch_size: 25
  max_length: 250
  lr: 5.0e-5
  weight_decay: 0.01
  epochs: 3
  imbalance_method: inverse_freq_ce
