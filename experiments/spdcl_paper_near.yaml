# SPDCL paper-near profile (Zhang et al. 2022) on imbalanced large dataset
dataset: yelp_2013
n_splits: 5
model: modernbert

modes:
  - raw
  - b2

folds: [0]

baseline:
  spdcl_n_bins: 5
  spdcl_curriculum_epochs: 5
  spdcl_anneal_epochs: 1

training:
  hf_model: answerdotai/ModernBERT-base
  batch_size: 25
  max_length: 250
  lr: 5.0e-5
  weight_decay: 0.01
  epochs: 6
  imbalance_method: inverse_freq_ce
