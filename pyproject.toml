[project]
name = "bio-is-curriculum"
version = "0.2.0"
description = "Data-efficient RoBERTa fine-tuning via bi-objective instance selection and curriculum learning"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "scikit-learn>=1.8.0",
    "scipy>=1.17.1",
    "torch>=2.2",
    "transformers>=4.41",
    "tqdm>=4.66",
    "openpyxl>=3.1.5",
    "pyyaml>=6.0.3",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
bio-run = "bio_is_curriculum.cli.main:main"
bio-experiment = "bio_is_curriculum.cli.experiment:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
